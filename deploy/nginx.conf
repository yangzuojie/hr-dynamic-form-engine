# /etc/nginx/sites-available/hr-form —— server_name 由 setup-server.sh 替换。
# 前端静态文件由 Nginx 直接提供；/api 转发给本机 Node（只监听 127.0.0.1）。HTTPS 证书由 certbot 写入。

limit_req_zone $binary_remote_addr zone=hr_public:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /opt/hr-form/web;
    index index.html;

    # 上传上限与后端一致（20MB）
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        # 公开接口（提交、上传）做简单限流，防止刷接口
        limit_req zone=hr_public burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 单页应用：其他路径都回到 index.html
    location / {
        try_files $uri /index.html;
    }
}
